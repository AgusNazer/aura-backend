spring.application.name=aura_farmer
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auradb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Mercado Pago
mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.notification-url=${MP_NOTIFICATION_URL}
mercadopago.back-url.success=${FRONTEND_URL:http://localhost:3000}/success
mercadopago.back-url.failure=${FRONTEND_URL:http://localhost:3000}/failure